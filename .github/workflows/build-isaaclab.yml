name: Build Isaac Lab Full Image

# Trigger manually from GitHub Actions tab
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Build can take 1-3 hrs — stay well under GitHub's 6hr job limit
    timeout-minutes: 300

    steps:
      # ---------------------------------------------------------------
      # 1. Free up disk space
      #    Default runner has ~14GB free — not enough for the ~18GB base
      #    Isaac Sim image. This action removes unused tools and frees
      #    ~30-40GB, giving us plenty of room.
      # ---------------------------------------------------------------
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Check available disk space
        run: df -h /

      # ---------------------------------------------------------------
      # 2. Check out the IsaacLab repo at the 2.3.2 tag
      # ---------------------------------------------------------------
      - name: Checkout IsaacLab v2.3.2
        uses: actions/checkout@v4
        with:
          repository: isaac-sim/IsaacLab
          ref: v2.3.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install container.py dependencies
        run: pip install pyyaml

      # ---------------------------------------------------------------
      # 3. Authenticate with NVIDIA NGC to pull the base Isaac Sim image
      #    NGC username is always the literal string "$oauthtoken"
      #    NGC_API_KEY must be added as a GitHub Actions secret
      # ---------------------------------------------------------------
      - name: Log in to NVIDIA NGC (nvcr.io)
        uses: docker/login-action@v3
        with:
          registry: nvcr.io
          username: $oauthtoken
          password: ${{ secrets.NGC_API_KEY }}

      # ---------------------------------------------------------------
      # 4. Authenticate with Docker Hub to push the final image
      #    DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be added as secrets
      # ---------------------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------------------------------------------------------
      # 5. Disable the interactive X11 forwarding prompt that
      #    container.py shows on first run
      # ---------------------------------------------------------------
      - name: Disable X11 forwarding prompt
        run: |
          mkdir -p docker
          printf '[X11]\nX11_FORWARDING_ENABLED = 0\n' > docker/.container.cfg

      # ---------------------------------------------------------------
      # 6. Build the full Isaac Lab image
      #    This pulls nvcr.io/nvidia/isaac-sim (~18GB) and builds
      #    Isaac Lab layers on top → produces "isaac-lab-base"
      # ---------------------------------------------------------------
      - name: Build isaac-lab-base image
        run: python docker/container.py build base

      # ---------------------------------------------------------------
      # 7. Add KasmVNC browser-accessible desktop + VirtualGL GPU rendering.
      #    - Port 6901: browser connects here to see the desktop
      #    - VirtualGL (vglrun): routes OpenGL calls to the real NVIDIA GPU
      #    - Isaac Sim runs windowed on the virtual display (no UDP/WebRTC)
      #    - Set VNC_PASSWORD env var in RunPod (default: isaac)
      # ---------------------------------------------------------------
      - name: Build KasmVNC desktop image
        run: |
          mkdir -p /tmp/kasm-ctx

          cat > /tmp/kasm-ctx/entrypoint.sh << 'ENTRYPOINT_SCRIPT'
          #!/bin/bash
          export HOME=/root
          export USER=root
          export DISPLAY=:1

          # RunPod mounts persistent storage at /workspace, which can hide
          # the Isaac Lab checkout baked into the image. Keep the official
          # Isaac Lab path available without copying repo contents into the
          # volume unless the user explicitly creates it there.
          mkdir -p /workspace/projects
          if [ -d /workspace/isaaclab ] && [ -z "$(find /workspace/isaaclab -mindepth 1 -maxdepth 1 -print -quit)" ]; then
              rmdir /workspace/isaaclab
          fi
          if [ ! -e /workspace/isaaclab ]; then
              ln -s /opt/isaaclab-seed /workspace/isaaclab
              echo "Linked /workspace/isaaclab -> /opt/isaaclab-seed"
          elif [ -L /workspace/isaaclab ]; then
              echo "/workspace/isaaclab symlink already exists"
          elif [ -f /workspace/isaaclab/isaaclab.sh ]; then
              echo "/workspace/isaaclab already exists; leaving it unchanged"
          else
              echo "WARNING: /workspace/isaaclab exists but does not look like Isaac Lab; leaving it unchanged"
          fi

          # SSH setup: RunPod injects PUBLIC_KEY env var at container start
          if [ -n "$PUBLIC_KEY" ]; then
              mkdir -p ~/.ssh && chmod 700 ~/.ssh
              echo "$PUBLIC_KEY" >> ~/.ssh/authorized_keys
              chmod 600 ~/.ssh/authorized_keys
          fi
          service ssh start

          export VNC_USER="${VNC_USER:-admin}"
          export VNC_PASSWORD="${VNC_PASSWORD:-isaac}"

          # Write KasmVNC user directly (vncpasswd requires a TTY).
          # KasmVNC uses SHA-256 crypt with fixed salt "kasm".
          python3 -c "import crypt,os; u=os.environ['VNC_USER']; p=os.environ['VNC_PASSWORD']; h=crypt.crypt(p,'\$5\$kasm\$'); open('/root/.kasmpasswd','w').write(u+':'+h+':w\n')"

          echo "Starting KasmVNC on port 6901 (user: $VNC_USER)..."
          vncserver :1 -geometry 1920x1080 -depth 24 \
            -localhost no -SecurityTypes VncAuth -websocketPort 6901 2>&1

          # Wait until Xvnc is actually accepting connections
          for i in $(seq 1 15); do
            DISPLAY=:1 xdpyinfo >/dev/null 2>&1 && break
            echo "Waiting for display :1... ($i/15)"
            sleep 1
          done
          echo "KasmVNC started"

          # Start window manager
          DISPLAY=:1 openbox &
          sleep 1

          # Launch Isaac Sim with VirtualGL GPU acceleration
          echo "Starting Isaac Sim (takes 2-3 min)..."
          VGL_DISPLAY=egl DISPLAY=:1 vglrun \
            /isaac-sim/isaac-sim.sh \
            --allow-root \
            --/persistent/isaac/asset_root/default="${OMNI_SERVER:-}" &

          echo "Isaac Sim launching. Open https://<runpod-host>:6901 in browser."
          wait
          ENTRYPOINT_SCRIPT

          cat > /tmp/kasm-ctx/kasmvnc.yaml << 'KASMVNC_YAML'
          logging:
            log_writer_name: all
            log_dest: logfile
            level: 100
          network:
            ssl:
              require_ssl: false
          KASMVNC_YAML

          cat > /tmp/kasm-ctx/Dockerfile << 'DOCKERFILE'
          FROM isaac-lab-base

          # Work around flatdict's legacy pkg_resources build dependency,
          # then ensure the core isaaclab package is installed. The upstream
          # installer can continue after this dependency error, leaving only
          # isaaclab_* extension packages installed.
          RUN /isaac-sim/python.sh -m pip install --no-build-isolation flatdict==4.0.1 && \
              cd /workspace/isaaclab && \
              /isaac-sim/python.sh -m pip install -e source/isaaclab

          # Preserve the official Isaac Lab checkout outside /workspace so
          # RunPod's /workspace volume mount cannot hide the only copy.
          RUN cp -a /workspace/isaaclab /opt/isaaclab-seed

          # VirtualGL + KasmVNC + minimal desktop (single apt-get update)
          RUN apt-get update && \
              apt-get install -y --no-install-recommends \
                openbox xterm dbus-x11 libgbm1 libxtst6 libxv1 libxfixes3 \
                python3-bcrypt openssh-server && \
              wget -q "https://github.com/VirtualGL/virtualgl/releases/download/3.1.1/virtualgl_3.1.1_amd64.deb" \
                -O /tmp/virtualgl.deb && \
              apt-get install -y /tmp/virtualgl.deb && \
              rm /tmp/virtualgl.deb && \
              wget -q "https://github.com/kasmtech/KasmVNC/releases/download/v1.3.3/kasmvncserver_noble_1.3.3_amd64.deb" \
                -O /tmp/kasmvnc.deb && \
              apt-get install -y /tmp/kasmvnc.deb && \
              rm /tmp/kasmvnc.deb && \
              apt-get clean && rm -rf /var/lib/apt/lists/*

          # Pre-configure KasmVNC: disable SSL (RunPod proxy handles TLS),
          # pre-create xstartup, and stub out select-de.sh so vncserver
          # never prompts for a desktop environment in non-interactive mode.
          RUN mkdir -p /root/.vnc
          COPY kasmvnc.yaml /root/.vnc/kasmvnc.yaml
          RUN printf '#!/bin/bash\nexec openbox &\n' > /root/.vnc/xstartup && \
              chmod +x /root/.vnc/xstartup
          RUN printf '#!/bin/bash\nexit 0\n' > /usr/lib/kasmvncserver/select-de.sh && \
              chmod +x /usr/lib/kasmvncserver/select-de.sh

          RUN mkdir /run/sshd && \
              sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config

          COPY entrypoint.sh /entrypoint.sh
          RUN chmod +x /entrypoint.sh

          EXPOSE 22 6901
          ENTRYPOINT ["/entrypoint.sh"]
          DOCKERFILE

          docker build -f /tmp/kasm-ctx/Dockerfile -t isaac-lab-base /tmp/kasm-ctx

      # ---------------------------------------------------------------
      # 8. Tag and push to Docker Hub
      # ---------------------------------------------------------------
      - name: Tag and push to Docker Hub
        run: |
          docker tag isaac-lab-base ${{ secrets.DOCKERHUB_USERNAME }}/isaac-lab-full:2.3.2
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/isaac-lab-full:2.3.2
          echo "Done! Image available at: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/isaac-lab-full:2.3.2"
